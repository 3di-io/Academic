<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#071629">
<title>دفترچه‌ی مطالعه</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#071629;--blue:#17345C;--steel:#9DB7D5;--mist:#EAF4FF;--soft:#3a5578;--ok:#14774a;--bad:#b73232;--line:rgba(23,52,92,.14)}
body{font-family:'Vazirmatn',Tahoma,sans-serif;min-height:100vh;padding:20px 14px 40px;color:var(--navy);-webkit-font-smoothing:antialiased;background:radial-gradient(900px 520px at 88% -8%,rgba(157,183,213,.34),transparent 62%),linear-gradient(180deg,#071629,#17345C);background-attachment:fixed}
.hide{display:none!important}.ltr{direction:ltr;text-align:right}
:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto}
.card{background:#fff;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 18px 44px rgba(7,22,41,.45)}
h1{font-size:20px}h3{font-size:15px;color:var(--blue);margin-bottom:12px}
.muted{color:#5b7391;font-size:12.5px}
input,select{font:inherit;color:var(--navy);padding:12px 14px;border:1px solid var(--steel);border-radius:14px;background:#fff;width:100%;outline:none}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(157,183,213,.55)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--soft)}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 20px;background:var(--blue);color:#fff;cursor:pointer}
.btn.ghost{background:var(--mist);color:var(--blue);font-weight:500}.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}.btn.del{background:#fbeaea;color:var(--bad)}
.btn:disabled{opacity:.6}
.err{color:var(--bad);font-size:13px;min-height:18px}
/* top */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:#fff;flex-wrap:wrap}
.top h1{flex:1}.top .chip{background:rgba(255,255,255,.14);padding:6px 12px;border-radius:99px;font-size:12.5px}
.seg{display:flex;gap:4px;background:var(--mist);padding:4px;border-radius:16px}
.seg button{font:inherit;border:0;background:none;padding:9px 16px;border-radius:12px;cursor:pointer;color:var(--soft);flex:1}
.seg button.on{background:var(--blue);color:#fff}
.tabs{margin-bottom:14px;background:rgba(255,255,255,.12)}.tabs button{color:#cfe0f5}.tabs button.on{background:#fff;color:var(--blue);font-weight:700}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--mist);border-radius:18px;padding:14px}
.stat span{font-size:12px;color:var(--soft);display:block}.stat b{font-size:22px;display:block;margin:4px 0 2px}.stat small{font-size:11.5px;color:#5b7391}
.stat.hl{background:var(--blue);color:#fff}.stat.hl span,.stat.hl small{color:#cfe0f5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.g2{grid-template-columns:1fr}}
.chh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}.chh .seg{padding:3px}.chh .seg button{padding:5px 11px;font-size:12.5px}
/* bar chart */
.bars{height:170px;display:flex;align-items:flex-end;gap:3px;position:relative;border-bottom:1px solid var(--line);padding-top:6px}
.bar{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end}
.bar i{display:block;width:100%;background:var(--steel);border-radius:6px 6px 0 0;min-height:0}
.bar.on i{background:var(--blue)}.bar.top i{background:var(--ok)}
.goal{position:absolute;right:0;left:0;border-top:2px dashed var(--bad);opacity:.6;pointer-events:none}
.xl{display:flex;gap:3px;margin-top:4px}.xl span{flex:1;font-size:10px;color:var(--soft);text-align:center;white-space:nowrap;overflow:visible;min-width:0}
/* table */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--soft);font-weight:500;text-align:right;padding:6px 8px}
td{padding:9px 8px;border-top:1px solid var(--line)}
.sbar{height:8px;border-radius:9px;background:var(--mist);min-width:70px}.sbar i{display:block;height:100%;border-radius:9px;background:var(--blue)}
.tw{overflow-x:auto}
/* history */
.day{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.dh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}.dh b{color:var(--blue)}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.it .s{font-weight:700;min-width:90px}.it .n{flex:1;color:var(--soft);font-size:12.5px;min-width:100px}
.pill{background:var(--mist);border-radius:99px;padding:3px 10px;font-size:12.5px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;font-size:13.5px;z-index:9}
@media(prefers-reduced-motion:no-preference){.card{animation:up .3s ease-out}@keyframes up{from{opacity:.4;transform:translateY(6px)}}}
</style>
</head>
<body>
<div class="wrap">

<div id="app">
  <div class="top"><h1>📘 دفترچه‌ی مطالعه</h1><span class="chip" id="today"></span></div>
  <div class="seg tabs" id="tabs"><button data-v="dash" class="on">📊 داشبورد</button><button data-v="add">✍️ ثبت گزارش</button><button data-v="hist">📅 تاریخچه</button></div>

  <!-- داشبورد -->
  <section id="dash">
    <div class="card"><div class="stats" id="stats"></div></div>
    <div class="card">
      <div class="chh"><h3>روند پیشرفت</h3><div class="seg" id="rng"><button data-r="7">۷ روز</button><button data-r="14" class="on">۱۴ روز</button><button data-r="30">۳۰ روز</button><button data-r="90">۹۰ روز</button></div></div>
      <div class="g2">
        <div><div class="chh"><b style="font-size:13.5px">زمان مطالعه (ساعت)</b><label class="muted">هدف روزانه (دقیقه) <input id="goal" type="number" min="30" max="1440" style="width:90px;padding:6px 8px"></label></div><div class="bars" id="cS"></div><div class="xl" id="xS"></div></div>
        <div><div class="chh"><b style="font-size:13.5px">تعداد تست</b></div><div class="bars" id="cT"></div><div class="xl" id="xT"></div></div>
      </div>
      <p class="muted" style="margin-top:10px">ستون سبز بهترین روز بازه است. خط قرمز، هدف روزانه است.</p>
    </div>
    <div class="card"><h3>آمار هر درس</h3><div class="tw" id="subj"></div></div>
  </section>

  <!-- ثبت -->
  <section id="add" class="hide">
    <form class="card" id="f">
      <h3 id="ft">گزارش جدید</h3>
      <div class="row">
        <label class="f">تاریخ<input type="date" id="fd" required></label>
        <label class="f">درس<input id="fs" list="sl" placeholder="مثلاً ریاضی" maxlength="40" required><datalist id="sl"></datalist></label>
      </div>
      <div class="row">
        <label class="f">مطالعه (ساعت)<input id="fh" type="number" min="0" max="24" value="0"></label>
        <label class="f">مطالعه (دقیقه)<input id="fm" type="number" min="0" max="59" value="0"></label>
        <label class="f">تعداد تست<input id="ft2" type="number" min="0" max="2000" value="0"></label>
      </div>
      <label class="f" style="margin-bottom:12px">یادداشت (اختیاری)<input id="fn" maxlength="200" placeholder="مبحث، اشتباهات، حس و حال…"></label>
      <div class="err" id="ferr" role="alert"></div>
      <div style="display:flex;gap:8px"><button class="btn" id="fb">ثبت گزارش</button><button type="button" class="btn ghost hide" id="fc">انصراف</button></div>
      <p class="muted" style="margin-top:10px">برای چند درس در یک روز، هر درس را جدا ثبت کن. پس از ثبت، پیام کوتاهی در تلگرام می‌آید.</p>
    </form>
  </section>

  <!-- تاریخچه -->
  <section id="hist" class="hide">
    <div class="card"><div class="stats" id="hstats"></div></div>
    <div class="card"><h3>روزهای ثبت‌شده</h3><div id="days"></div></div>
  </section>
</div>
</div>
<div class="toast hide" id="toast"></div>

<script>
/* ===== تنظیمات: دو مقدار زیر را از Project Settings → API در سوپابیس بردار ===== */
const CFG = {url: 'https://gmqttymxiaaqhfvvzxhe.supabase.co', key: 'sb_publishable_tq5cNQcDJaJfl2pgfH6r6g_LbB0HVuM'};
const DEFAULT_SUBJECTS = ['ریاضی', 'فیزیک', 'شیمی', 'زیست', 'ادبیات', 'عربی', 'دین و زندگی', 'زبان انگلیسی'];

let sb = null, SETUP_ERR = '';
try {
  if (typeof supabase === 'undefined') SETUP_ERR = 'کتابخانه‌ی سوپابیس بارگذاری نشد؛ اینترنت یا فیلترشکن را بررسی کن.';
  else if (!/^https:\/\/.+\.supabase\.co\/?$/.test(CFG.url) || CFG.key.startsWith('YOUR_')) SETUP_ERR = 'آدرس و کلید سوپابیس هنوز در بالای اسکریپت (CFG) وارد نشده است.';
  else sb = supabase.createClient(CFG.url, CFG.key, {auth: {persistSession: false}});
} catch (e) {SETUP_ERR = 'تنظیمات سوپابیس معتبر نیست: ' + e.message}
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const fa = n => Number(n).toLocaleString('fa-IR', {maximumFractionDigits: 1});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const dOf = k => new Date(k + 'T12:00:00');
const addDays = (k, n) => {const d = dOf(k); d.setDate(d.getDate() + n); return keyOf(d)};
const TODAY = keyOf(new Date());
const jl = (k, o) => new Intl.DateTimeFormat('fa-IR-u-ca-persian', o || {year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'}).format(dOf(k));
const jShort = k => new Intl.DateTimeFormat('fa-IR-u-ca-persian', {month: 'numeric', day: 'numeric'}).format(dOf(k));
const tm = m => { const h = Math.floor(m / 60), r = m % 60; return h ? fa(h) + ' ساعت' + (r ? ' و ' + fa(r) + ' دقیقه' : '') : fa(r) + ' دقیقه' };
let LOGS = [], RNG = 14, EDIT = null, tt;

function toast(t) {const e = $('#toast'); e.textContent = t; e.classList.remove('hide'); clearTimeout(tt); tt = setTimeout(() => e.classList.add('hide'), 2600)}

/* ===== شروع ===== */
async function start() {
  $('#today').textContent = jl(TODAY); $('#fd').value = TODAY; $('#fd').max = TODAY;
  $('#goal').value = localStorage.getItem('goal') || 240;
  await load();
}
async function load() {
  if (!sb) {render(); $('#days').innerHTML = $('#subj').innerHTML = `<p class="err">${SETUP_ERR}</p>`; return}
  const {data, error} = await sb.from('study_logs').select('*').order('day', {ascending: false}).order('created_at', {ascending: false}).limit(5000);
  if (error) {toast('دریافت اطلاعات ممکن نشد: ' + error.message); console.error(error); return}
  LOGS = data; render();
}

/* ===== تجمیع داده ===== */
function byDay() {const m = {}; LOGS.forEach(r => {const d = m[r.day] ||= {m: 0, t: 0, items: []}; d.m += r.minutes; d.t += r.tests; d.items.push(r)}); return m}
function bySubj() {const m = {}; LOGS.forEach(r => {const s = m[r.subject] ||= {m: 0, t: 0, d: new Set()}; s.m += r.minutes; s.t += r.tests; s.d.add(r.day)}); return m}
function streak(D) {let n = 0, k = D[TODAY] ? TODAY : addDays(TODAY, -1); while (D[k]) {n++; k = addDays(k, -1)} return n}

function statCards(D) {
  const days = Object.keys(D).length, M = LOGS.reduce((a, r) => a + r.minutes, 0), T = LOGS.reduce((a, r) => a + r.tests, 0), td = D[TODAY] || {m: 0, t: 0};
  const best = Object.entries(D).sort((a, b) => b[1].m - a[1].m)[0];
  return [['کل مطالعه', tm(M), days ? 'میانگین روزانه: ' + tm(Math.round(M / days)) : '', 'hl'], ['کل تست‌ها', fa(T), days ? 'میانگین روزانه: ' + fa(Math.round(T / days)) : ''],
    ['امروز', tm(td.m), fa(td.t) + ' تست'], ['روزهای ثبت‌شده', fa(days), 'پیاپی تا امروز: ' + fa(streak(D)) + ' روز'],
    ['بهترین روز', best ? tm(best[1].m) : '—', best ? jl(best[0], {month: 'long', day: 'numeric'}) : '']]
    .map(([l, v, s, c]) => `<div class="stat ${c || ''}"><span>${l}</span><b>${v}</b><small>${s}</small></div>`).join('');
}

/* ===== رندر ===== */
function render() {
  const D = byDay(); $('#stats').innerHTML = statCards(D); $('#hstats').innerHTML = statCards(D);
  $('#sl').innerHTML = [...new Set([...DEFAULT_SUBJECTS, ...LOGS.map(r => r.subject)])].map(s => `<option value="${esc(s)}">`).join('');
  chart(D); subjects(); history(D);
}
function chart(D) {
  const goal = +$('#goal').value || 240, ks = []; for (let i = RNG - 1; i >= 0; i--) ks.push(addDays(TODAY, -i));
  const draw = (box, xl, vals, fmt, goalV) => {
    const max = Math.max(1, goalV || 0, ...vals), top = Math.max(...vals);
    $(box).innerHTML = vals.map((v, i) => `<div class="bar${ks[i] === TODAY ? ' on' : ''}${v && v === top ? ' top' : ''}" title="${jl(ks[i], {month: 'long', day: 'numeric'})}: ${fmt(v)}"><i style="height:${v * 100 / max}%"></i></div>`).join('') + (goalV ? `<div class="goal" style="bottom:${goalV * 100 / max}%"></div>` : '');
    const st = Math.ceil(ks.length / 10); $(xl).innerHTML = ks.map((k, i) => `<span>${i % st === 0 ? jShort(k) : ''}</span>`).join('');
  };
  draw('#cS', '#xS', ks.map(k => D[k] ? D[k].m : 0), v => tm(v), goal);
  draw('#cT', '#xT', ks.map(k => D[k] ? D[k].t : 0), v => fa(v) + ' تست');
}
function subjects() {
  const S = bySubj(), rows = Object.entries(S).sort((a, b) => b[1].m - a[1].m), tot = rows.reduce((a, [, s]) => a + s.m, 0) || 1;
  $('#subj').innerHTML = rows.length ? `<table><tr><th>درس</th><th>زمان مطالعه</th><th>تست</th><th>تست در ساعت</th><th>سهم از کل</th></tr>${rows.map(([n, s]) => `<tr><td><b>${esc(n)}</b></td><td>${tm(s.m)}</td><td>${fa(s.t)}</td><td>${s.m >= 30 ? fa(s.t / (s.m / 60)) : '—'}</td><td><div class="sbar"><i style="width:${s.m * 100 / tot}%"></i></div><span class="muted">${fa(Math.round(s.m * 100 / tot))}٪</span></td></tr>`).join('')}</table>` : '<p class="muted">هنوز گزارشی ثبت نشده. از «ثبت گزارش» شروع کن.</p>';
}
function history(D) {
  const ks = Object.keys(D).sort().reverse();
  $('#days').innerHTML = ks.map(k => {const d = D[k]; return `<div class="day"><div class="dh"><b>${jl(k)}</b><span><span class="pill">${tm(d.m)}</span> <span class="pill">${fa(d.t)} تست</span></span></div>${d.items.map(r => `<div class="it"><span class="s">${esc(r.subject)}</span><span class="pill">${tm(r.minutes)}</span><span class="pill">${fa(r.tests)} تست</span><span class="n">${esc(r.note || '')}</span><button class="btn ghost sm" data-e="${r.id}">ویرایش</button><button class="btn del sm" data-d="${r.id}">حذف</button></div>`).join('')}</div>`}).join('') || '<p class="muted">تاریخچه‌ات پس از اولین گزارش اینجا ساخته می‌شود.</p>';
}

/* ===== ناوبری ===== */
function view(v) {$$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); ['dash', 'add', 'hist'].forEach(x => $('#' + x).classList.toggle('hide', x !== v)); scrollTo(0, 0)}
$('#tabs').onclick = e => {const b = e.target.closest('button'); if (b) {if (b.dataset.v !== 'add') resetForm(); view(b.dataset.v)}};
$('#rng').onclick = e => {const b = e.target.closest('button'); if (!b) return; RNG = +b.dataset.r; $$('#rng button').forEach(x => x.classList.toggle('on', x === b)); chart(byDay())};
$('#goal').onchange = () => {localStorage.setItem('goal', $('#goal').value); chart(byDay())};

/* ===== ثبت و ویرایش ===== */
function resetForm() {EDIT = null; $('#f').reset(); $('#fd').value = TODAY; $('#ft').textContent = 'گزارش جدید'; $('#fb').textContent = 'ثبت گزارش'; $('#fc').classList.add('hide'); $('#ferr').textContent = ''}
$('#fc').onclick = () => {resetForm(); view('hist')};
$('#days').onclick = async e => {
  const ed = e.target.closest('[data-e]'), dl = e.target.closest('[data-d]');
  if (ed) {
    const r = LOGS.find(x => x.id === ed.dataset.e); EDIT = r;
    $('#fd').value = r.day; $('#fs').value = r.subject; $('#fh').value = Math.floor(r.minutes / 60); $('#fm').value = r.minutes % 60; $('#ft2').value = r.tests; $('#fn').value = r.note || '';
    $('#ft').textContent = 'ویرایش گزارش'; $('#fb').textContent = 'ذخیره‌ی تغییرات'; $('#fc').classList.remove('hide'); view('add');
  }
  if (dl) {
    if (!sb) return; const r = LOGS.find(x => x.id === dl.dataset.d); if (!confirm('گزارش «' + r.subject + '» حذف شود؟')) return;
    const {error} = await sb.from('study_logs').delete().eq('id', r.id); if (error) return toast('حذف نشد');
    notify({action: 'delete', day: r.day, subject: r.subject, minutes: r.minutes, tests: r.tests}); toast('حذف شد'); load();
  }
};
$('#f').onsubmit = async e => {
  e.preventDefault(); $('#ferr').textContent = '';
  const minutes = (+$('#fh').value || 0) * 60 + (+$('#fm').value || 0), tests = +$('#ft2').value || 0;
  if (!minutes && !tests) {$('#ferr').textContent = 'حداقل یکی از زمان مطالعه یا تعداد تست را وارد کن.'; return}
  const row = {day: $('#fd').value, subject: $('#fs').value.trim(), minutes, tests, note: $('#fn').value.trim() || null};
  if (!sb) {$('#ferr').textContent = SETUP_ERR; return}
  $('#fb').disabled = true;
  const q = EDIT ? sb.from('study_logs').update(row).eq('id', EDIT.id).select().single() : sb.from('study_logs').insert(row).select().single();
  const {data, error} = await q; $('#fb').disabled = false;
  if (error) {$('#ferr').textContent = 'ذخیره نشد؛ اتصال اینترنت و تنظیمات سوپابیس را بررسی کن.'; return}
  notify({action: EDIT ? 'update' : 'insert', id: data.id}); toast(EDIT ? 'تغییرات ذخیره شد' : 'گزارش ثبت شد');
  const wasEdit = !!EDIT, d = row.day; resetForm(); $('#fd').value = d; await load(); if (wasEdit) view('hist');
};
/* پیام تلگرام: از طریق Edge Function — اگر خطا داد، ثبت گزارش را مختل نمی‌کند */
async function notify(body) {if (!sb) return; try {const {error} = await sb.functions.invoke('notify', {body}); if (error) toast('گزارش ثبت شد، اما پیام تلگرام ارسال نشد')} catch (e) {}}

start();
</script>
</body>
</html>
